<!DOCTYPE html>
<html lang="en">
    <head>
        <title>After School Website</title>
        <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"/>    
    </head>
    <body>
        <div id="app">
            <header>
                <h1 v-text="sitename"></h1>
                <button v-on:click="showCheckout">
                    <span class="fas fa-cart-plus"></span>
                    Checkout {{ cartItemCount }}

                </button>
                {{ sumOfCart }}
            </header>
            <main>
                <div id="showProduct">
                    <figure v-for="x in activity" v-bind:key="x.id">
                        <img v-bind:src="x.image">
                        <h2>{{x.class}}</h2>
                        <p>Price: AED {{x.price}}</p>
                        <p>Available Inventory: {{x.availableInventory}}</p>
                        <button v-on:click="addToCart(x)" v-if="x.availableInventory > 0">
                            Add to cart
                        </button>
                        <button disabled="disabled" v-else>
                            Add to cart
                        </button> 
                    </figure>
                </div>
                <div id="showCheckout" v-if="!showProduct">
                    <h2>Checkout</h2>
                    {{ sumOfCart }}
                </div>
            </main>
        </div>
        <script type="text/javascript">
            let webstore = new Vue({
                el: '#app',
                data: {
                    sitename: 'Afterschool Activities',
                    showProduct: true,
                    totalCart: 0,
                    cart: [],
                    activity: [
                        {id: 1001, class: 'Football', price: 110, image: 'images/football.jpg', availableInventory: 5},
                        {id: 1002, class: 'Basketball', price: 120, image: 'images/basketball.jpg', availableInventory: 5},
                        {id: 1003, class: 'Swimming', price: 130, image: 'images/swimming.jpg', availableInventory: 5},
                        {id: 1004, class: 'Tennis', price: 140, image: 'images/tennis.jpg', availableInventory: 5},
                        {id: 1005, class: 'Cricket', price: 150, image: 'images/cricket.jpg', availableInventory: 5},
                        {id: 1006, class: 'Dance', price: 160, image: 'images/dance.jpg', availableInventory: 5},
                        {id: 1007, class: 'Singing', price: 170, image: 'images/singing.jpg', availableInventory: 5},
                        {id: 1008, class: 'Gymnastics', price: 180, image: 'images/gymnastics.jpg', availableInventory: 5},
                        {id: 1009, class: 'Ice Hockey', price: 190, image: 'images/ice_hockey.jpg', availableInventory: 5},
                        {id: 1010, class: 'Karate', price: 200, image: 'images/karate.jpg', availableInventory: 5}
                    ]
                },
                methods: {
                    addToCart: function(activity) { //allows the activity to be added and decrease slots available
                        this.cart.push(activity.id);
                        activity.availableInventory--;
                    },
                    showCheckout: function() {
                        this.showProduct = false;
                    }
                },
                computed: {
                    cartItemCount: function() {
                        return this.cart.length ||"";
                    },
                    sumOfCart: function() {
                        let total = 0;
                        for (let i = 0; i < this.cart.length; i++) {
                            let activityId = this.cart[i];
                            total += this.activity[activityId - 1001].price;
                            this.totalCart = total;
                        }
                        return total;
                    }
                }
            });
        </script>
    </body>
</html>
