<!DOCTYPE html>
<html lang="en">
    <head>
        <title>After School Website</title>
        <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"/>    
    </head>
    <body>
        <div id="app">
            <header>
                <h1 v-text="sitename"></h1>
                <button v-on:click="showCheckout">
                    <span class="fas fa-cart-plus"></span>
                    Checkout {{ cartItemCount }}
                </button>
                {{ sumOfCart }}
            </header>
            <main>
                <div id="Main" v-if="showProduct">
                    <figure v-for="x in activity" v-bind:key="x.id">
                        <img v-bind:src="x.image">
                        <h2>{{x.class}}</h2>
                        <p>Location: {{x.location}}</p>
                        <p>Price: AED {{x.price}}</p>
                        <p>Available Inventory: {{x.availableInventory}}</p>
                        <button v-on:click="addToCart(x)" v-if="x.availableInventory > 0">
                            Add to cart
                        </button>
                        <button disabled="disabled" v-else>
                            Add to cart
                        </button> 
                    </figure>
                </div>
                <div v-else>
                    <h2>Checkout</h2>
                    <div v-for="item in cartSlots" :key="item.id">
                        <h3>{{ item.class }}</h3>
                        <p>Location: {{ item.location }}</p>
                        <p>Price: AED {{ item.price }}</p>
                        <p>Quantity: {{ item.quantity }}</p>
                    </div>
                    <h3>Total: AED {{ sumOfCart }}</h3>
                </div>
            </main>
        </div>
        <script type="text/javascript">
            let webstore = new Vue({
                el: '#app',
                data: {
                    sitename: 'Afterschool Activities',
                    showProduct: true,
                    totalCart: 0,
                    cart: [],
                    overallSlots: [],
                    userEmail: '',
                    activity: [
                        {id: 1001, class: 'Football', location: 'Dubai, Al Wasl Sports Club', price: 110, image: 'images/football.jpg', availableInventory: 5, quantity: 0},
                        {id: 1002, class: 'Basketball', location: 'Dubai, JSS Private School', price: 120, image: 'images/basketball.jpg', availableInventory: 5, quantity: 0},
                        {id: 1003, class: 'Swimming', location: 'Abu Dhabi, Abu Dhabi Country Club', price: 130, image: 'images/swimming.jpg', availableInventory: 5, quantity: 0},
                        {id: 1004, class: 'Tennis', location: 'Dubai, Al Naayat Street', price: 140, image: 'images/tennis.jpg', availableInventory: 5, quantity: 0},
                        {id: 1005, class: 'Cricket', location: 'Abu Dhabi, Zayed Sports City', price: 150, image: 'images/cricket.jpg', availableInventory: 5, quantity: 0},
                        {id: 1006, class: 'Dance', location: 'Sharjah, Wanderers Sports Club', price: 160, image: 'images/dance.jpg', availableInventory: 5, quantity: 0},
                        {id: 1007, class: 'Singing', location: 'Dubai, Al Wasl Sports Club', price: 170, image: 'images/singing.jpg', availableInventory: 5, quantity: 0},
                        {id: 1008, class: 'Gymnastics', location: 'Sharjah, Baseline Sports Academy', price: 180, image: 'images/gymnastics.jpg', availableInventory: 5, quantity: 0},
                        {id: 1009, class: 'Ice Hockey', location: 'Abu Dhabi, Zayed Sports City', price: 190, image: 'images/ice_hockey.jpg', availableInventory: 5, quantity: 0},
                        {id: 1010, class: 'Karate', location: 'Sharjah, Wanderers Sports Club', price: 200, image: 'images/karate.jpg', availableInventory: 5, quantity: 0}
                    ],
                },
                methods: {
                    addToCart: function(activity) { //allows the activity to be added and decrease slots available
                        this.cart.push(activity);
                        activity.availableInventory--
                    },
                    showCheckout: function() {
                        this.showProduct = this.showProduct ? false:true;
                    },

                },
                computed: {
                    cartItemCount: function() {
                        return this.cart.length ||"";
                    },
                    sumOfCart: function() {//calculates the total price of the cart
                    return this.cart.reduce(function(total, item) {
                       return total + item.price;
                       }, 0);   
                    },
                    cartSlots: function() {
                        return Object.values(
                            this.cart.reduce(function(slots, item) {
                                if(slots[item.id]) {
                                    slots[item.id].quantity++;
                                } else {
                                    slots[item.id] = {
                                        class: item.class,
                                        location: item.location,
                                        price: item.price,
                                        quantity: 1
                                    };
                                }
                                return slots;
                            }, {})
                        )
                    }
                }
            });
        </script>
    </body>
</html>
